<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Research Paper Insight Planner — Proposed MVP Architecture</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      --paper: #f8f7f3;
      --paper-2: #eff4f5;
      --ink: #172634;
      --muted: #526470;
      --soft: #526470;
      --rule: rgba(23,38,52,0.12);
      --rule-solid: #9caab4;
      --accent: #237c86;
      --accent-tint: rgba(35,124,134,0.08);
      --link: #14566b;
      --danger: #9b2c2c;
      --sans: Arial, system-ui, sans-serif;
      --serif: Georgia, serif;
      --mono: Menlo, Monaco, Consolas, ui-monospace, monospace;
    }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 32px;
      color: var(--ink);
      background: var(--paper);
      font-family: var(--sans);
    }
    main { width: min(100%, 1280px); margin: 0 auto; }
    .page-header { display: flex; align-items: end; justify-content: space-between; gap: 32px; margin-bottom: 16px; }
    .eyebrow { margin: 0 0 8px; color: var(--muted); font: 500 10px/1.4 var(--mono); letter-spacing: .18em; text-transform: uppercase; }
    h1 { margin: 0; font: 400 28px/1.1 var(--serif); letter-spacing: -.02em; }
    .lede { max-width: 520px; margin: 0 0 2px; color: var(--muted); font-size: 13px; line-height: 1.5; }
    .diagram-container { width: 100%; overflow-x: auto; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
    svg { display: block; width: 100%; min-width: 1280px; }
    @media print {
      body { padding: 0; }
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <main>
    <header class="page-header">
      <div>
        <p class="eyebrow">Architecture · Secure Paved Road · Proposed</p>
        <h1>Research Paper Insight Planner MVP</h1>
      </div>
      <p class="lede">Only confirmed, lawfully retrieved paper versions can pass the privileged evidence gate into durable records and deterministic Markdown.</p>
    </header>

    <div class="diagram-container">

        </defs>

        <rect width="1280" height="720" fill="#f8f7f3"/>

        <!-- Three trust zones -->
        <rect x="40" y="40" width="280" height="520" rx="8" fill="rgba(23,38,52,0.02)" stroke="rgba(23,38,52,0.12)" stroke-width="1"/>
        <rect x="56" y="44" width="104" height="16" rx="2" fill="#f8f7f3"/>
        <text x="108" y="56" fill="#526470" font-size="8" font-family="Menlo, Monaco, Consolas, ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">EXTERNAL ZONE</text>

        <rect x="360" y="40" width="360" height="520" rx="8" fill="rgba(35,124,134,0.03)" stroke="rgba(35,124,134,0.50)" stroke-width="1" stroke-dasharray="4,4"/>

        <rect x="760" y="40" width="480" height="520" rx="8" fill="rgba(23,38,52,0.02)" stroke="rgba(23,38,52,0.12)" stroke-width="1"/>

        <text x="864" y="56" fill="#526470" font-size="8" font-family="Menlo, Monaco, Consolas, ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">ISOLATED PROCESSING + DATA</text>

        <line data-route="blocked-paywall" x1="264" y1="520" x2="344" y2="520" stroke="#9b2c2c" stroke-width="1.4" stroke-dasharray="5,4"/>

        <text x="960" y="180" fill="#526470" font-size="9" font-family="Menlo, Monaco, Consolas, ui-monospace, monospace" text-anchor="middle">ephemeral · no DB creds · bounded egress</text>
